<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Mission Map Check</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Barlow+Condensed:wght@600;700;800&family=Source+Sans+3:wght@400;600;700&display=swap">
<style>
:root{
  --crimson:#822336; --crimson-ink:#6b1c2c; --crimson-soft:#f6e9ec;
  --bg:#f7f6f6; --surface:#ffffff; --fg:#1d1a1b; --muted:#5f5b5d; --line:#d0d1d3; --line-soft:#e6e5e6;
  --good:#1f6b45; --good-soft:#e5f2ea; --warn:#8a5a00; --warn-soft:#fbf1dc; --bad:#a3271f; --bad-soft:#fbe7e5;
  --brand:#822336; --brand-2:#6a1b2b; --on-brand:#ffffff;
  --display:"Barlow Condensed","Arial Narrow",Arial,sans-serif;
  --body:"Source Sans 3","Segoe UI",system-ui,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root{
  --crimson:#d9677c; --crimson-ink:#ef93a3; --crimson-soft:#3a1d24;
  --bg:#161314; --surface:#211d1f; --fg:#efeaeb; --muted:#aca6a8; --line:#4a4447; --line-soft:#332e30;
  --good:#7fd1a2; --good-soft:#1c3327; --warn:#f0c46a; --warn-soft:#3a2f17; --bad:#f08b80; --bad-soft:#3b1f1c; color-scheme:dark}}
*{box-sizing:border-box}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 80px)}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--body);font-size:16px;line-height:1.5}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--brand)}
.wrap{max-width:1120px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--brand);color:var(--on-brand)}
header.top .wrap{display:flex;align-items:center;gap:16px;padding-block:10px;flex-wrap:wrap}
.brand{font-family:var(--display);font-weight:800;font-size:1.45rem;letter-spacing:.02em;text-transform:uppercase;line-height:1}
.brand small{display:block;font-family:var(--body);font-weight:600;font-size:.72rem;letter-spacing:.08em;opacity:.85}
.prog{flex:1;min-width:180px}
.prog-label{font-size:.8rem;font-weight:600;letter-spacing:.06em;text-transform:uppercase;opacity:.9}
.bar{height:6px;background:rgba(255,255,255,.25);border-radius:3px;overflow:hidden;margin-top:4px}
.bar i{display:block;height:100%;background:#fff;width:0;transition:width .3s}
.hdr-stats{display:flex;gap:18px}
.hdr-total{font-family:var(--display);font-weight:700;font-size:1.3rem;text-align:right;line-height:1.05}
.hdr-total span{display:block;font-family:var(--body);font-size:.7rem;font-weight:600;letter-spacing:.08em;text-transform:uppercase;opacity:.85}
main .wrap{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:24px;padding-block:24px 48px;align-items:start}
@media (max-width:860px){main .wrap{grid-template-columns:minmax(0,1fr)}}
.panel{min-width:0}
h1,h2,h3{text-wrap:balance}
h1{font-family:var(--display);font-weight:800;font-size:clamp(2rem,5vw,2.8rem);line-height:1;margin:0 0 8px;text-transform:uppercase;letter-spacing:.01em}
h2{font-family:var(--display);font-weight:700;font-size:1.35rem;margin:26px 0 8px;text-transform:uppercase;letter-spacing:.03em}
.eyebrow{font-size:.78rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--crimson)}
.lede{color:var(--muted);max-width:64ch;margin:0 0 16px}
.hint{font-size:.9rem;color:var(--muted);margin:0 0 10px}
.opts{display:grid;gap:10px}
.opts.two{grid-template-columns:repeat(auto-fill,minmax(240px,1fr))}
.opt{font:inherit;color:var(--fg);text-align:left;display:grid;grid-template-columns:auto minmax(0,1fr);gap:12px;align-items:center;background:var(--surface);border:1.5px solid var(--line);border-radius:10px;padding:12px 14px;cursor:pointer;transition:border-color .15s,background .15s;width:100%}
.opt:hover{border-color:var(--crimson)}
.opt.on{border-color:var(--crimson);background:var(--crimson-soft)}
.opt .mark{width:22px;height:22px;border:2px solid var(--line);border-radius:50%;display:grid;place-items:center;flex:none}
.opt.multi .mark{border-radius:5px}
.opt.on .mark{border-color:var(--crimson);background:var(--crimson)}
.opt.on .mark::after{content:"";width:8px;height:8px;background:#fff;border-radius:50%}
.opt.multi.on .mark::after{width:10px;height:6px;border:2px solid #fff;border-top:0;border-right:0;background:none;border-radius:0;transform:rotate(-45deg) translate(1px,-1px)}
.opt b{display:block;font-weight:700}
.opt p{margin:2px 0 0;font-size:.9rem;color:var(--muted)}
.opt:disabled{opacity:.45;cursor:not-allowed}
.nav{display:flex;justify-content:space-between;gap:12px;margin-top:26px;flex-wrap:wrap}
.btn{font:inherit;font-weight:700;border-radius:8px;padding:11px 20px;cursor:pointer;border:1.5px solid var(--brand);background:var(--brand);color:var(--on-brand)}
.btn:hover{filter:brightness(1.15)}
.btn.ghost{background:transparent;color:var(--crimson)}
.btn.ghost:hover{background:var(--crimson-soft);filter:none}
.btn.small{padding:6px 12px;font-size:.88rem}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn:focus-visible,.opt:focus-visible,.car:focus-visible,.chip:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,.flip:focus-visible{outline:3px solid var(--crimson);outline-offset:2px}
.need{background:var(--warn-soft);color:var(--warn);border-radius:8px;padding:8px 12px;font-size:.9rem;font-weight:600;margin-top:12px}
.fields{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;max-width:680px}
label.f{display:grid;gap:4px;font-weight:600;font-size:.92rem}
label.f span{font-weight:400;color:var(--muted);font-size:.85rem}
input[type=text],input[type=search],select,textarea{font:inherit;color:var(--fg);background:var(--surface);border:1.5px solid var(--line);border-radius:8px;padding:9px 11px;width:100%}
textarea{min-height:80px;resize:vertical}
.how{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;margin:20px 0}
.how div{border-left:3px solid var(--crimson);padding:4px 0 4px 12px}
.how b{display:block}
.how span{color:var(--muted);font-size:.92rem}
/* careers */
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0}
.chip{font:inherit;font-size:.85rem;font-weight:600;border:1.5px solid var(--line);background:var(--surface);color:var(--fg);border-radius:999px;padding:4px 12px;cursor:pointer}
.chip.on{background:var(--brand);border-color:var(--brand);color:var(--on-brand)}
.cars{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px}
.car{font:inherit;color:var(--fg);text-align:left;background:var(--surface);border:1.5px solid var(--line);border-radius:10px;padding:12px 14px;cursor:pointer;display:grid;gap:2px}
.car:hover{border-color:var(--crimson)}
.car.on{border-color:var(--crimson);background:var(--crimson-soft)}
.car b{font-size:1.02rem}
.car span{font-size:.84rem;color:var(--muted)}
.car em{font-style:normal;font-family:var(--display);font-weight:700;font-size:1.15rem;color:var(--crimson)}
.picked{background:var(--surface);border:1.5px solid var(--crimson);border-radius:12px;padding:14px 16px;margin:14px 0;display:grid;gap:6px}
.picked .t{font-family:var(--display);font-size:1.6rem;font-weight:800;text-transform:uppercase;line-height:1}
.picked dl{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;margin:4px 0 0;font-size:.93rem}
.picked dt{font-weight:700;color:var(--muted)}
.picked dd{margin:0}
/* sidebar */
aside.side{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px;position:sticky;top:calc(env(safe-area-inset-top,0px) + 84px)}
@media (max-width:860px){aside.side{position:static}}
.side h3{font-family:var(--display);font-size:1.1rem;text-transform:uppercase;letter-spacing:.05em;margin:0 0 2px}
.side .who{font-size:.85rem;color:var(--muted);margin-bottom:12px}
.stair{display:grid;gap:8px}
.st{display:grid;grid-template-columns:28px minmax(0,1fr);gap:8px;align-items:start}
.st i{font-style:normal;width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:.85rem;background:var(--line-soft);color:var(--muted)}
.st.done i{background:var(--brand);color:var(--on-brand)}
.st.cur i{outline:2px solid var(--crimson);outline-offset:2px}
.st b{display:block;font-size:.8rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.st span{font-size:.9rem;display:block;overflow-wrap:anywhere}
.st.mission{border-bottom:1px dashed var(--line);padding-bottom:8px}
.meters{display:grid;gap:10px}
.m{display:grid;gap:3px}
.m .lab{display:flex;justify-content:space-between;font-size:.88rem;font-variant-numeric:tabular-nums}
.m .lab b{font-weight:700}
.mbar{height:9px;background:var(--line-soft);border-radius:5px;overflow:hidden}
.mbar i{display:block;height:100%;background:var(--crimson);transition:width .4s}
.mbar.low i{background:var(--warn)}
.money{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:4px}
.money div{background:var(--bg);border-radius:8px;padding:8px 10px}
.money span{display:block;font-size:.72rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.money b{font-family:var(--display);font-size:1.35rem;font-variant-numeric:tabular-nums}
.where{font-size:.88rem;background:var(--crimson-soft);border-radius:8px;padding:8px 10px;margin-bottom:12px}
/* checks */
.checks{display:grid;gap:10px}
.ck{display:grid;grid-template-columns:30px minmax(0,1fr);gap:10px;background:var(--surface);border:1px solid var(--line);border-left-width:5px;border-radius:10px;padding:12px 14px}
.ck.ok{border-left-color:var(--good)} .ck.warn{border-left-color:var(--warn)} .ck.bad{border-left-color:var(--bad)}
.ck .ic{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:.9rem}
.ck.ok .ic{background:var(--good-soft);color:var(--good)} .ck.warn .ic{background:var(--warn-soft);color:var(--warn)} .ck.bad .ic{background:var(--bad-soft);color:var(--bad)}
.ck b{display:block}
.ck p{margin:2px 0 0;font-size:.93rem;color:var(--muted)}
.ck .fix{margin-top:6px}
.score{display:flex;align-items:center;gap:18px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 18px;margin:14px 0}
.ring{--p:0;width:92px;height:92px;border-radius:50%;background:conic-gradient(var(--crimson) calc(var(--p)*1%),var(--line-soft) 0);display:grid;place-items:center;flex:none}
.ring b{width:72px;height:72px;border-radius:50%;background:var(--surface);display:grid;place-items:center;font-family:var(--display);font-size:1.9rem;font-weight:800}
/* game */
.story{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px 18px;margin:12px 0}
.story p{margin:0 0 8px} .story p:last-child{margin:0}
.recap{font-size:.92rem;color:var(--muted);border-top:1px dashed var(--line);margin-top:10px;padding-top:10px}
.result{border-radius:10px;padding:14px 16px;margin:14px 0;background:var(--crimson-soft)}
.result b{display:block;margin-bottom:4px}
.deltas{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.d{font-size:.8rem;font-weight:700;padding:2px 9px;border-radius:999px;font-variant-numeric:tabular-nums}
.d.up{background:var(--good-soft);color:var(--good)} .d.dn{background:var(--bad-soft);color:var(--bad)}
.deal{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;margin:12px 0}
@media (max-width:680px){.deal{grid-template-columns:minmax(0,1fr)}}
.flip{font:inherit;color:inherit;background:none;border:0;padding:0;perspective:1000px;height:250px;cursor:pointer;text-align:left;display:block;width:100%}
.flip:disabled{cursor:default}
.flip-in{display:block;position:relative;height:100%;transition:transform .6s cubic-bezier(.3,.7,.3,1);transform-style:preserve-3d}
.flip:not(:disabled):hover .flip-in{transform:translateY(-5px) rotate(-1.5deg)}
.flip.flipped .flip-in{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:6px}
.back{background:repeating-linear-gradient(135deg,var(--brand) 0 14px,var(--brand-2) 14px 28px);color:var(--on-brand);align-items:center;justify-content:center;text-align:center;font-weight:700;letter-spacing:.14em;text-transform:uppercase;font-size:.8rem;box-shadow:0 8px 20px rgba(0,0,0,.2)}
.back .q{font-family:var(--display);font-size:4.5rem;line-height:1;letter-spacing:0}
.front{transform:rotateY(180deg);background:var(--surface);border:2px solid var(--line);justify-content:center}
.front small{font-size:.72rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.front b{font-family:var(--display);font-size:1.5rem;line-height:1.05;text-transform:uppercase}
.front p{margin:0;font-size:.9rem;color:var(--muted)}
.flip.good .front small{color:var(--good)}
.flip.chosen .front{border-color:var(--crimson);box-shadow:0 0 0 4px var(--crimson-soft)}
.flip.dim .front{opacity:.55}
.shield{border-radius:10px;padding:12px 14px;margin:12px 0;font-weight:600}
.shield.yes{background:var(--good-soft);color:var(--good)}
.shield.no{background:var(--warn-soft);color:var(--warn)}
.shield q{font-weight:400;display:block;margin-top:4px;font-style:italic;quotes:none}
/* results */
.outcome{border-radius:14px;padding:20px 22px;margin:8px 0 18px;color:var(--on-brand);background:var(--brand)}
.outcome.mid{background:#7a5a10} .outcome.low{background:#5f5b5d}
.outcome small{font-size:.78rem;font-weight:700;letter-spacing:.12em;text-transform:uppercase;opacity:.85}
.outcome b{display:block;font-family:var(--display);font-size:clamp(2rem,5vw,2.8rem);line-height:1;text-transform:uppercase;margin:4px 0 8px}
.outcome p{margin:0;max-width:62ch}
.tl{display:grid;gap:0;border-left:3px solid var(--line);margin-left:8px}
.tl li{list-style:none;position:relative;padding:0 0 16px 18px}
.tl li::before{content:"";position:absolute;left:-9px;top:4px;width:15px;height:15px;border-radius:50%;background:var(--surface);border:3px solid var(--crimson)}
.tl ul{padding:0;margin:0}
.tl b{display:block}
.tl span{display:block;font-size:.92rem;color:var(--muted)}
.vgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin:12px 0}
.vbox{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 14px}
.vbox span{display:block;font-size:.75rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.vbox b{font-family:var(--display);font-size:1.6rem;line-height:1.1;font-variant-numeric:tabular-nums}
.vbox p{margin:2px 0 0;font-size:.83rem;color:var(--muted)}
.tips{display:grid;gap:10px;padding:0;margin:0;counter-reset:t}
.tips li{list-style:none;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 14px 12px 50px;position:relative;counter-increment:t}
.tips li::before{content:counter(t);position:absolute;left:14px;top:12px;width:24px;height:24px;border-radius:50%;background:var(--brand);color:var(--on-brand);display:grid;place-items:center;font-weight:700;font-size:.85rem}
.tips b{display:block}
.qs{display:grid;gap:14px;max-width:720px}
.again{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:14px;margin-top:28px;padding:16px;border:1.5px dashed var(--line);border-radius:10px}
.again-btns{display:flex;gap:10px;flex-wrap:wrap}
.confirm{background:var(--warn-soft);color:var(--warn);border-radius:10px;padding:12px 14px;margin-top:12px;display:flex;flex-wrap:wrap;gap:10px;align-items:center;font-weight:600}
.copied{font-size:.9rem;font-weight:600;color:var(--good)}
.src{font-size:.82rem;color:var(--muted);margin-top:28px;max-width:80ch}
.src a,.learn a{color:var(--crimson)}
.learn{margin-top:18px;border-top:1px solid var(--line);padding-top:12px;font-size:.92rem;color:var(--muted)}
.learn summary{cursor:pointer;font-weight:700;color:var(--fg)}
.ifrow{display:grid;gap:6px;background:var(--surface);border:1.5px solid var(--crimson);border-radius:10px;padding:12px 14px}
.ifrow b{font-size:.95rem}
.ifrow .pre{font-weight:700;color:var(--crimson)}
.count{font-size:.9rem;color:var(--muted);margin:6px 0}
.meme{position:relative;background:#111;color:#fff;border-radius:12px;aspect-ratio:4/3;max-width:300px;width:100%;display:grid;grid-template-rows:auto 1fr auto;text-align:center;padding:10px 12px;overflow:hidden;box-shadow:0 6px 16px rgba(0,0,0,.25)}
.meme .mt,.meme .mb{font-family:Anton,Impact,"Arial Black",sans-serif;text-transform:uppercase;font-size:1.15rem;line-height:1.1;letter-spacing:.02em;text-shadow:2px 2px 0 #000,-1px -1px 0 #000,1px -1px 0 #000,-1px 1px 0 #000;overflow-wrap:anywhere}
.meme .me{font-size:4.6rem;line-height:1;display:grid;place-items:center}
.meme.sm{max-width:220px}.meme.sm .me{font-size:3.4rem}.meme.sm .mt,.meme.sm .mb{font-size:.95rem}
.res-grid{display:grid;grid-template-columns:minmax(0,1fr) 260px;gap:16px;align-items:center}
@media (max-width:640px){.res-grid{grid-template-columns:minmax(0,1fr)}.res-grid .meme{max-width:260px}}
.sit{display:inline-block;font-size:.75rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;background:var(--brand);color:var(--on-brand);border-radius:999px;padding:2px 10px;margin-bottom:6px}
.front .fe{font-size:2.2rem;line-height:1}
.outcome .oe{font-size:3rem;line-height:1;float:right;margin-left:12px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<header class="top">
  <div class="wrap">
    <div class="brand">Mission Map Check<small>Toppenish Wildcats · Test-drive your 10-year plan</small></div>
    <div class="prog"><div class="prog-label" id="progLabel">Getting started</div><div class="bar"><i id="progBar"></i></div></div>
    <div class="hdr-stats" id="hdrStats"></div>
  </div>
</header>
<main><div class="wrap">
  <section class="panel" id="panel" aria-live="polite"></section>
  <aside class="side" id="side"></aside>
</div></main>

<script>
/* ================= DATA ================= */
const MINW = 17.13;                     // WA minimum wage 2026 (L&I)
const MINW_YR = Math.round(MINW*2080);  // full-time year
const WA_MED = 62990;                   // BLS OEWS May 2025, WA all-occupation median
const RC_URL = "https://claude.ai/artifact/S1M4SzmvH36eMueHMr2AjH";

/* Careers. Wages: BLS OEWS May 2025 annual medians (WA statewide, Yakima metro).
   paths = roads that lead there, with years of training after high school. */
const C = (id,t,g,wa,yak,edu,paths,gpa,comp,step,extra)=>Object.assign({id,t,g,wa,yak,edu,paths,gpa,comp,step},extra||{});
const CAREERS = [
 C("rn","Registered Nurse","Health",124200,102950,"A 2-year nursing degree (ADN) or a 4-year BSN, then the NCLEX license exam. Nursing programs are competitive.",{cc:3,univ:4},3.0,true,"Nursing Assistant (CNA)"),
 C("cna","Nursing Assistant (CNA)","Health",49180,47080,"A state-approved CNA course (a few weeks to a few months) and a state exam.",{cert:.5,cc:.5,work:1},2.0,false,""),
 C("ma","Medical Assistant","Health",59290,49310,"A medical assistant certificate, usually about a year.",{cert:1,cc:1},2.0,false,""),
 C("dh","Dental Hygienist","Health",131160,120690,"A 2–3 year dental hygiene degree and a state license. Programs are competitive.",{cc:3,univ:4},3.2,true,"Dental Assistant"),
 C("medic","Paramedic","Health",104310,null,"EMT certificate first, then about 1–2 years of paramedic training.",{cc:2,cert:2},2.5,false,"EMT"),
 C("pa","Physician Assistant","Health",164360,136570,"A 4-year degree, hands-on patient care hours, then a 2–3 year PA master's program.",{univ:7},3.3,true,"Medical Assistant or CNA"),
 C("dr","Doctor (Physician)","Health",null,null,"A 4-year degree, 4 years of medical school, then 3–7 years of residency.",{univ:11},3.6,true,"Medical scribe or CNA",{wageNote:"U.S. median is above $239,000 (BLS)",natWage:239200}),
 C("pt","Physical Therapist","Health",105950,105950,"A 4-year degree, then a 3-year Doctor of Physical Therapy (DPT).",{univ:7},3.3,true,"Physical therapy aide"),

/* taxes: 2026 federal single filer; WA has no income tax; FICA + WA PFML + WA Cares */
function fedTax(G){const t=Math.max(0,G-16100);const b=[[12400,.10],[50400,.12],[105700,.22],[201775,.24],[256225,.32],[640600,.35],[Infinity,.37]];let prev=0,tax=0;for(const[cap,r]of b){if(t>prev)tax+=(Math.min(t,cap)-prev)*r;prev=cap}return tax}
function takeHome(G){const ss=.062*Math.min(G,184500),med=.0145*G,pfml=.008072*Math.min(G,184500),cares=.0058*G;return G-fedTax(G)-ss-med-pfml-cares}
function salaryNeeded(annual){let lo=0,hi=2e6;for(let i=0;i<70;i++){const m=(lo+hi)/2;if(takeHome(m)<annual)lo=m;else hi=m}return hi}
function mortgage(price){const P=price*0.95,r=0.0625/12,n=360;return Math.round(P*r/(1-Math.pow(1+r,-n))+price*0.01/12+100)}
const OTHER_MONTHLY=1610; // food 450, car+insurance+gas 650, utilities 250, phone 60, other 200
function life10(){
  const L=LOCS10[S.loc]||LOCS10.top;
  const housing=S.live10==="fam"?500:S.live10==="own"?mortgage(L.h):L.r;
  const kids=(KIDS[S.kids]||KIDS.no).c;
  return {housing,other:OTHER_MONTHLY,kids,total:housing+OTHER_MONTHLY+kids};
}

/* ================= ROUTE LOGIC ================= */
function bestKey(c){
  const keys=Object.keys(c.paths).filter(k=>k!=="mil");
  if(!keys.length)return "mil";
  return keys.sort((a,b)=>c.paths[a]-c.paths[b])[0];
}
function kindOf(k){return k==="univ"||k==="cc"||k==="cert"?"school":k==="appr"?"appr":k==="work"?"work":"mil"}
function route(){
  const c=career(),p=S.path;
  if(!c)return {ok:false,why:"nocareer"};
  if(!p||p==="unsure")return {ok:false,why:"unsure",off:"pre-work"};
  if(c.paths[p]!=null)return {ok:true,via:p,start:0,yrs:c.paths[p],kind:kindOf(p)};
  if(p==="cc"&&c.paths.univ!=null)return S.transfer?{ok:true,via:"cc-transfer",start:0,yrs:c.paths.univ,kind:"school"}:{ok:false,why:"transfer",off:"off-school"};
  if(p==="mil"){const k=bestKey(c);return {ok:true,via:"mil-gi",start:4,yrs:c.paths[k],kind:k==="appr"?"appr":k==="work"?"work":"gi",pre:"mil",altKey:k}}
  if(p==="work")return {ok:false,why:"work",off:"pre-work"};
  if(p==="appr")return {ok:false,why:"appr",off:"pre-work"};
  return {ok:false,why:p==="univ"?"overshoot":"wrong",off:"off-school"};
}
const finishOf=R=>R.start+R.yrs;
function routeLabel(R){
  if(!R.ok)return "No road to this career yet";
  const m={univ:"4-year university","cc":"Yakima Valley College","cc-transfer":"YVC, then transfer to a university",cert:"technical school",appr:"apprenticeship",work:"working your way in",mil:"military training","mil-gi":"military first, then GI Bill training"};
  return m[R.via]||R.via;
}

function checks(){
  const c=career(),R=route(),out=[];
  const add=(k,label,st,msg,fix,go)=>out.push({k,label,st,msg,fix,go});
  // 1 mission
  const ms=S.mission.trim();
  ms.length>=15?add("mission","Mission statement","ok","You wrote it down. That's your compass.","",1)
    :add("mission","Mission statement","warn","Your mission statement is missing or very short.","Copy the 1–3 sentences from Step 1 of your handout.",1);
  if(!c){add("route","Road to your career","bad","Pick a career first.","",1);return out}
  // 2 route
  const why={unsure:"You don't have an after-high-school plan yet, so there's no road to "+c.t+".",
    transfer:c.t+" needs a 4-year degree. YVC alone gives you a 2-year degree.",
    overshoot:"A university isn't the usual road to "+c.t+". It costs more and takes longer.",
    wrong:"That road doesn't usually lead to "+c.t+".",
    work:c.t+" needs training you can't get just by working.",
    appr:c.t+" isn't learned through an apprenticeship."}[R.why];
  const roads=Object.keys(c.paths).map(k=>PATHS[k].t.toLowerCase()).join(", ");
  if(R.ok)add("route","Road to your career","ok",(R.via==="mil-gi"?"Military first, then the GI Bill can help pay for training as a "+c.t+". It works, it just adds time.":"Your 4-year goal ("+routeLabel(R)+") leads to "+c.t+"."),"",4);
  else add("route","Road to your career","bad",why,"Roads that lead there: "+roads+(c.paths.univ!=null&&!c.paths.cc?", or YVC and then transfer":"")+".",4);
  // 3 timeline
  if(R.ok){
    const f=finishOf(R);const s7=S.seven;let st="ok",msg,fix="";
    const doneTxt="Training for "+c.t+" takes about "+fmtYrs(R.yrs)+(R.start?" after "+R.start+" years of service":"")+", so you'd finish around "+yearOf(f)+" (age "+ageOf(f)+").";
    if(f>6){st="warn";msg=doneTxt+" That's after year 10.";fix="That's OK for a long career. Change your 10-year goal to where you'll be in training then (for example \"in "+(c.id==="dr"?"medical residency":"my last years of school")+"\").";}
    else if(s7==="career"&&f>3.5){st="warn";msg=doneTxt+" Your 7-year goal says you'll be working in your career, but you'd still be training.";fix="Change your 7-year goal to \"finishing school or training\", or pick a faster road.";}
    else if((s7==="finishing"||s7==="both")&&f<=2.5){st="warn";msg=doneTxt+" You could be done before year 7.";fix="Aim higher: make your 7-year goal \"working in my career\".";}
    else if(s7==="working"&&!["work"].includes(R.via)&&f>3.5){st="warn";msg=doneTxt+" Your 7-year goal says you won't be in school.";fix="Make your 7-year goal match your training.";}
    else msg=doneTxt+" Your 7-year and 10-year goals line up with that.";
    add("time","Timeline adds up",st,msg,fix,3);
  } else add("time","Timeline adds up","bad","Without a road there's no timeline yet.","Fix your 4-year goal first.",4);
  // 4 grades
  const T=parseFloat(S.gpaT);
  if(!S.gpaT)add("gpa","Grades match the goal","bad","You didn't set a GPA goal.","",5);
  else if(T>=c.gpa)add("gpa","Grades match the goal","ok","Your goal ("+GPAS[S.gpaT]+") meets what "+c.t+" programs usually look for ("+c.gpa.toFixed(1)+"+).","",5);
  else add("gpa","Grades match the goal",T>=c.gpa-.5?"warn":"bad","Your goal ("+GPAS[S.gpaT]+") is below the "+c.gpa.toFixed(1)+"+ that "+(c.comp?"competitive ":"")+"programs for "+c.t+" usually look for.","Raise your 1-year GPA goal and add study habits to your daily goals.",5);
  // 5 money
  const school=R.ok?R.kind==="school":["univ","cc","cert"].includes(S.path);
  if(!S.pay.length||has(S.pay,"none"))add("money","Money plan","bad","You don't have a plan to pay for life after high school.","Add FAFSA/WASFA, scholarships or a part-time job to your 4-year goal.",4);
  else if(school&&!has(S.pay,"fafsa"))add("money","Money plan","warn","No FAFSA or WASFA. That's how you get Washington College Grant money, and about half of Washington families qualify for some.","Add \"Fill out the FAFSA or WASFA\" to your 4-year goal.",4);
  else add("money","Money plan","ok","You have a plan to pay your way.","",4);
  // 6 experience
  const rel=S.acts.filter(a=>["cte","club","shadow","job","vol"].includes(a)).length;
  rel>=2?add("exp","Experience starts now","ok","You'll build real experience in high school.","",5)
   :add("exp","Experience starts now",rel===1?"warn":"bad",rel?"One activity is a start.":"No career-related activities this year.",GROUP_TIP[c.g]||"Add a CTE class, a career club or a job shadow to your 1-year goal.",5);
  // 7 habits
  const study=S.habits.filter(h=>HABITS.find(x=>x.id===h&&x.study)).length;
  if(S.habits.length>=3&&study>=2)add("habits","Daily habits","ok","Your daily goals give your GPA goal a real chance.","",6);
  else add("habits","Daily habits",S.habits.length>=2?"warn":"bad","Big goals are built from daily habits. You have "+S.habits.length+" daily goal"+(S.habits.length===1?"":"s")+" and "+study+" study habit"+(study===1?"":"s")+".","Pick at least 3 daily goals, including 2 study habits.",6);
  // 8 WWWW
  if(wwwSpecific())add("www","WHAT, HOW, WHEN, WHERE","ok","Your monthly goal is specific.","",6);
  else if(wwwOk())add("www","WHAT, HOW, WHEN, WHERE","warn","All four boxes are filled, but WHEN is vague.","Use a day and time, like \"Mon–Thu, 6:00–6:45 pm\".",6);
  else add("www","WHAT, HOW, WHEN, WHERE","bad","Some of the four boxes are empty.","Fill in all four from Step 3 of your handout.",6);
  // 9 if-then
  const n=ifsDone().length;
  add("ifs","If…Then plans",n>=3?"ok":n?"warn":"bad",n>=3?"You have 3 backup plans ready.":"You have "+n+" of 3 If…Then plans.",n>=3?"":"Add If…Then plans until you have 3.",7);
  // 10 lifestyle
  const L=life10(),need=salaryNeeded(L.total*12),lw=localWage(c);
  if(!S.loc||!S.live10)add("life","Can you afford your 10-year life?","bad","Pick where and how you want to live.","",2);
  else if(!lw)add("life","Can you afford your 10-year life?","warn","Pay for this career varies a lot. Your lifestyle needs about "+money(need)+" a year.","Look up real pay in WA Reality Check.",2);
  else{const r=lw.w/need;
    add("life","Can you afford your 10-year life?",r>=1?"ok":r>=.85?"warn":"bad",
     "Your 10-year life in "+LOCS10[S.loc].t+" costs about "+money(L.total)+"/month, so you'd need about "+money(need)+" a year. Half of "+c.t+"s in the "+lw.where+" earn "+money(lw.w)+" or more.",
     r>=1?"":"Pick a cheaper place to live, live with roommates or family longer, or choose a higher-paying career.",2)}
  return out;
}
function fmtYrs(y){return y<1?"less than a year":(Number.isInteger(y)?y:y.toFixed(1))+" year"+(y===1?"":"s")}
function scoreOf(cs){return cs.reduce((a,c)=>a+(c.st==="ok"?10:c.st==="warn"?5:0),0)}

function newGame(){
  let gpa=2.4;
  S.habits.forEach(h=>{const x=HABITS.find(a=>a.id===h);if(x&&x.gpa)gpa+=x.gpa});
  if(wwwSpecific())gpa+=.1;
  gpa+=((parseFloat(S.gpaT)||2.5)-2.5)*.25;
  const R=route();
  S.G={gpa:clamp(gpa,0,4),skills:10,network:10,energy:60+(has(S.habits,"sleep")?10:0)+(has(S.habits,"move")?10:0),
    cash:0,debt:0,borrowed:0,delay:0,R,fafsa:has(S.pay,"fafsa"),early:false,rs:false,wildcat:false,wageMult:1,
    ch:0,picks:{},cards:{},log:[],misses:[],used:[],crunch:0,recap:{},hsGpa:null,autoDone:{},carNote:""};
  S.G.energy=clamp(S.G.energy,0,100);
}
function statusAt(y){
  const G=S.G,R=G.R;
  if(!R.ok)return R.off||"pre-work";
  if(y-1<R.start)return R.pre||"pre-work";
  const tEnd=R.start+R.yrs+G.delay;
  return (y-.5<tEnd)?"train":"career";
}
function curFinish(){const R=S.G.R;return R.ok?R.start+R.yrs+S.G.delay:Infinity}
function tuitionAt(y){
  const R=S.G.R;
  if(R.kind==="gi")return 0;
  if(R.via==="univ")return (SCHOOLS[S.school]||SCHOOLS.cwu).tu;
  if(R.via==="cc")return TU_CC;
  if(R.via==="cc-transfer")return (y-R.start)<=2?TU_CC:SCHOOLS.cwu.tu;
  if(R.via==="cert")return TU_CERT;
  if(R.via==="fix"){return R.fixKey==="univ"?SCHOOLS.cwu.tu:R.fixKey==="cc"?TU_CC:R.fixKey==="cert"?TU_CERT:0}
  return 0;
}
function offTuition(){return S.path==="univ"?(SCHOOLS[S.school]||SCHOOLS.cwu).tu:S.path==="cc"?TU_CC:S.path==="cert"?TU_CERT:0}
function live4Yr(inSchool){const l=LIVE4[S.live4]||LIVE4.home;if(S.live4==="dorm"&&!inSchool)return LIVE4.room.yr;return l.yr}

function spend(amount,why){ // pay a cost; returns note
  const G=S.G;
  if(G.cash>=amount){G.cash-=amount;return ""}
  const rem=amount-G.cash;G.cash=0;
  if(has(S.pay,"loans")){G.debt+=rem;G.borrowed+=rem;return "borrowed "+money(rem)}
  return "short "+money(rem);
}
function simYear(y){
  const G=S.G,R=G.R,st=statusAt(y),pay=S.pay;
  let inc=0,aid=0,tu=0,live=0;
  if(st==="career"){inc=takeHome(wageForSim()*.85*G.wageMult);live=life10().total*12}
  else if(st==="train"){
    const k=R.kind;
    if(k==="school"||k==="gi"){
      tu=tuitionAt(y);
      if(R.pt){inc=takeHome(MINW_YR*.6);tu=tu*.6}
      else if(has(pay,"job"))inc+=takeHome(15000);
      if(has(pay,"family"))inc+=3000;
      if(k==="gi")inc+=12000;
      if(G.fafsa&&k!=="gi")aid+=tu+3000;
      if(has(pay,"schol"))aid+=(G.gpa>=3?2000:800)*(G.early?1:.5);
      if(G.wildcat&&y<=4)aid+=5000;
      live=live4Yr(true);
    } else if(k==="appr"){inc=takeHome(wageForSim()*.6);live=live4Yr(false)}
    else if(k==="work"){inc=takeHome(MINW_YR);live=live4Yr(false)}
    else {inc=24000;live=3000}
  } else if(st==="mil"){inc=24000;live=3000}
  else if(st==="off-school"){
    tu=offTuition();if(has(pay,"job"))inc+=takeHome(15000);if(has(pay,"family"))inc+=3000;
    if(G.fafsa)aid+=tu+3000;live=live4Yr(true);
  } else {inc=takeHome(MINW_YR);live=live4Yr(false)}
  let net=inc+aid-tu-live,note="";
  if(st==="career"&&G.debt>0){const p=Math.min(G.debt,Math.max(2400,G.debt*.12));net-=p;G.debt-=p}
  if(net>=0)G.cash+=Math.round(net*(has(S.habits,"save")?.5:.3));
  else{note=spend(-net);if(note.startsWith("short"))return {st,inc,aid,tu,live,net,short:-net}}
  return {st,inc,aid,tu,live,net};
}
function simChapter(ch){ // post-HS chapters 3,4,5 -> years 1-2,3-4,5-6
  const G=S.G;G.simDone=G.simDone||{};if(G.simDone[ch])return;G.simDone[ch]=1;
  const ys=[ch*2-5,ch*2-4];let r={inc:0,aid:0,tu:0,live:0,short:0,st:[]};
  ys.forEach(y=>{const o=simYear(y);r.inc+=o.inc;r.aid+=o.aid;r.tu+=o.tu;r.live+=o.live;r.st.push(o.st);if(o.short)r.short+=o.short});
  if(r.short>0){
    G.crunch++;G.debt+=Math.round(r.short*.3);G.energy=clamp(G.energy-10,0,100);
    if(G.R.ok&&r.st.includes("train")){G.delay+=.5;G.log.push({ch:ch+1,t:"Money ran out. You dropped to part-time for a semester, and some bills went on a credit card."})}
    else G.log.push({ch:ch+1,t:"Money ran out. Some bills went on a credit card."});
  }
  if(G.energy<25&&G.R.ok&&r.st.includes("train")){G.delay+=.5;G.energy=40;G.log.push({ch:ch+1,t:"You burned out and took a semester off to reset."})}
  G.energy=clamp(G.energy+8,0,100);
  G.recap[ch]=r;
}
function fx(eff,shield){ // apply effects; returns list of delta chips
  const G=S.G,out=[];
  for(const k in eff){
    let v=eff[k];if(!v)continue;
    if(shield&&v<0)v=k==="delay"?0:(k==="gpa"?Math.round(v/2*100)/100:Math.round(v/2));
    if(shield&&k==="delay")v=0;
    if(!v)continue;
    if(k==="gpa"){G.gpa=clamp(G.gpa+v,0,4);out.push([v>0,"GPA "+(v>0?"+":"−")+Math.abs(v).toFixed(2)])}
    else if(k==="cash"){if(v>0){G.cash+=v}else{G.cash+=v;if(G.cash<0&&G.ch<3)G.cash=0;if(G.cash<0){G.debt+=-G.cash;out.push([false,"Debt +"+money(-G.cash)]);G.cash=0}}out.push([v>0,(v>0?"+":"−")+money(Math.abs(v)).replace("−","")])}
    else if(k==="debt"){G.debt+=v;out.push([v<0,"Debt "+(v>0?"+":"−")+money(Math.abs(v))])}
    else if(k==="delay"){if(G.R.ok){G.delay=Math.max(0,G.delay+v);out.push([v<0,(v>0?"+":"−")+fmtYrs(Math.abs(v))+" to finish"])}}
    else if(k==="wage"){G.wageMult*=v;out.push([true,"Pay +"+Math.round((v-1)*100)+"%"])}
    else{G[k]=clamp(G[k]+v,0,100);const n={skills:"Skills",network:"Network",energy:"Energy"}[k];out.push([v>0,n+" "+(v>0?"+":"−")+Math.abs(v)])}
  }
  return out;
}
const chips=a=>'<div class="deltas">'+a.map(([up,t])=>'<span class="d '+(up?"up":"dn")+'">'+esc(t)+"</span>").join("")+"</div>";

function lateGate(c){const G=S.G;if(G.hsGpa!=null&&G.hsGpa<c.gpa&&G.R.kind==="school"){G.delay+=.5;G.log.push({ch:5,t:"Your high school GPA was below what "+c.t+" programs look for, so you took a semester of classes at YVC first."})}}
function highSchoolEnd(){
  const G=S.G,c=career(),R=G.R;G.hsGpa=G.gpa;

  if(R.ok&&R.kind==="school"&&G.rs){const cut=R.via==="cert"?.5:1;R.yrs=Math.max(.5,R.yrs-cut);G.log.push({ch:3,t:"Running Start credits cut about "+fmtYrs(cut)+" off your training."})}
  if(R.ok&&c&&G.gpa<c.gpa){

     row("★","Mission","" + (S.mission.trim()?S.mission.trim().slice(0,90)+(S.mission.trim().length>90?"…":""):""),!!S.mission.trim(),st===1,"mission")+
     row(5,"10-year goal",c?c.t+(S.loc?", "+LOCS10[S.loc].t:""):"",!!(c&&S.loc),st===1||st===2)+
     row(4,"7-year goal",S.seven?SEVEN[S.seven].t:"",!!S.seven,st===3)+
     row(3,"4-year goal",S.path?PATHS[S.path].t+(S.path==="univ"&&S.school?": "+SCHOOLS[S.school].t:"")+(S.path==="cc"&&S.transfer?", then transfer":""):"",!!S.path,st===4)+
     row(2,"1-year goal",S.gpaT?"GPA "+GPAS[S.gpaT]+(S.acts.length?", "+S.acts.length+" activit"+(S.acts.length===1?"y":"ies"):""):"",!!S.gpaT,st===5)+
     row(1,"This month & daily",S.habits.length?S.habits.length+" daily goal"+(S.habits.length===1?"":"s"):"",S.habits.length>0,st===6)+
     row("!","If… Then…",ifsDone().length?ifsDone().length+" of 3 plans":"",ifsDone().length>0,st===7)+
     '</div>'+(c&&st>=4&&S.path?'<p class="hint" style="margin:12px 0 0">Road: '+esc(routeLabel(R))+'</p>':"");
    return;
  }
  const G=S.G,c=career();
  const bar=(lab,val,max,disp)=>'<div class="m"><div class="lab"><span>'+lab+'</span><b>'+disp+'</b></div><div class="mbar'+(val/max<.3?" low":"")+'"><i style="width:'+clamp(val/max*100,0,100)+'%"></i></div></div>';
  s.innerHTML='<h3>'+esc(S.name||"You")+'</h3><div class="who">Goal: '+esc(c?c.t:"")+'</div><div class="meters">'+
   bar(G.ch<3&&st<RESULTS?"📚 GPA":"📚 Grades",G.gpa,4,G.gpa.toFixed(2))+bar("🛠️ Skills",G.skills,100,Math.round(G.skills))+bar("🤝 Network",G.network,100,Math.round(G.network))+bar("⚡ Energy",G.energy,100,Math.round(G.energy))+
   '<div class="money"><div><span>💰 Savings</span><b>'+money(G.cash)+'</b></div><div><span>💳 Debt</span><b>'+money(G.debt)+'</b></div></div></div>'+
   '<p class="hint" style="margin:12px 0 0">If…Then plans: '+(ifsDone().map(k=>esc(low(OBS[k].t))).join("; ")||"none")+'</p>';
}
function renderHdr(){
  const st=S.step,el=$("#hdrStats");
  if(st<GAME0){const c=career();el.innerHTML=c&&st>=2?'<div class="hdr-total"><span>Plan strength</span><b>'+scoreOf(checks())+'/100</b></div>':"";return}
  if(st<RESULTS){const ch=Math.floor((st-GAME0)/3);el.innerHTML='<div class="hdr-total"><span>Years</span><b>'+CHAPTERS[ch].yrs+'</b></div><div class="hdr-total"><span>Age</span><b>'+CHAPTERS[ch].age+'</b></div>';return}
  el.innerHTML='<div class="hdr-total"><span>Year 10</span><b>2036</b></div>';
}

/* ---------- events ---------- */
function go(d){
  let n=S.step+d;
  if(S.step===GAME0&&d<0)n=8;
  if(S.step>=GAME0&&S.step<RESULTS&&d>0&&(S.step-GAME0)%3===2){const ch=Math.floor((S.step-GAME0)/3);if(ch>=3)simChapter(ch)}
  S.step=clamp(n,0,RESULTS);render();
  try{window.scrollTo({top:0})}catch(e){}
}
function toggle(arr,v){const i=arr.indexOf(v);if(i>=0)arr.splice(i,1);else arr.push(v)}
function bind(){
  $$("[data-go]").forEach(b=>b.onclick=()=>go(+b.dataset.go));
  $$("[data-jump]").forEach(b=>b.onclick=()=>{S.step=+b.dataset.jump;render()});
  const inp=(id,key)=>{const e=$("#"+id);if(e)e.oninput=()=>{S[key]=e.value;save();
    if(key==="name"){const n=$('[data-go="1"]');if(n)n.disabled=!e.value.trim()}
    if(key==="mission")renderSide()}};
  inp("nm","name");inp("pd","period");inp("mission","mission");inp("tenTxt","tenTxt");inp("sevenTxt","sevenTxt");
  const q=$("#q");if(q)q.oninput=()=>{S.q=q.value;$("#cars").innerHTML=carsHtml();bindCars();save()};
  $$("[data-grp]").forEach(b=>b.onclick=()=>{S.group=b.dataset.grp;render()});
  bindCars();
  const cn=$("#cname"),ce=$("#cedu");
  const custom=()=>{S.cname=cn.value;S.cedu=ce.value;if(S.cname.trim()&&S.cedu){S.career="custom"}else if(S.career==="custom")S.career="";save();
    const n=$('[data-go="1"]');if(n)n.disabled=!career();$$(".car").forEach(x=>x.classList.toggle("on",x.dataset.car===S.career));renderSide()};
  if(cn){cn.oninput=custom;ce.onchange=custom}
  const one=(attr,key)=>$$("["+attr+"]").forEach(b=>b.onclick=()=>{S[key]=b.getAttribute(attr);if(key==="path"){if(S.path!=="univ"){S.school="";if(S.live4==="dorm")S.live4=""}if(S.path!=="cc")S.transfer=false}render()});
  one("data-loc","loc");one("data-live10","live10");one("data-kids","kids");one("data-seven","seven");one("data-path","path");one("data-school","school");one("data-live4","live4");one("data-gpa","gpaT");
  $$("[data-transfer]").forEach(b=>b.onclick=()=>{S.transfer=!S.transfer;render()});
  $$("[data-pay]").forEach(b=>b.onclick=()=>{const v=b.dataset.pay;if(v==="none")S.pay=has(S.pay,"none")?[]:["none"];else{S.pay=S.pay.filter(x=>x!=="none");toggle(S.pay,v)}render()});
  $$("[data-act]").forEach(b=>b.onclick=()=>{toggle(S.acts,b.dataset.act);render()});
  $$("[data-hab]").forEach(b=>b.onclick=()=>{toggle(S.habits,b.dataset.hab);render()});
  $$("[data-www]").forEach(e=>e.oninput=()=>{S.www[e.dataset.www]=e.value;save()});
  $$("[data-obs]").forEach(b=>b.onclick=()=>{const k=b.dataset.obs;if(k in S.ifs)delete S.ifs[k];else if(Object.keys(S.ifs).length<3)S.ifs[k]="";render()});
  $$("[data-then]").forEach(e=>e.oninput=()=>{S.ifs[e.dataset.then]=e.value;save();renderSide()});
  $$("[data-ans]").forEach(e=>e.oninput=()=>{S.ans[e.dataset.ans]=e.value;save()});
  const pl=$("#play");if(pl)pl.onclick=()=>{newGame();S.step=GAME0;render();try{window.scrollTo({top:0})}catch(e){}};
  $$("[data-pick]").forEach(b=>b.onclick=()=>{
    const ch=S.G.ch,ph=S.G.ph,ci=decision(ch,ph),i=+b.dataset.pick,o=ci.opts[i];
    const snap={title:ci.title,story:ci.story,opts:ci.opts.map(x=>({l:x.l,d:x.d,m:x.m}))};const r=o.run();
    S.G.picks[ch+"-"+ph]={i,l:o.l,t:r.t,chips:fx(r.fx||{}),snap};render()});
  $$("[data-card]").forEach(b=>b.onclick=()=>{
    const G=S.G,ch=G.ch,cd=G.cards[ch];if(cd.pick!=null)return;
    const i=+b.dataset.card,c=DECK.find(d=>d.id===cd.ids[i]);
    const sh=c.cat!=="good"&&(S.ifs[c.cat]||"").trim().length>=3;
    cd.pick=i;cd.shield=sh;cd.chips=fx(c.fx,sh);
    if(c.cat!=="good"){if(sh)G.used.push(c.cat);else G.misses.push(c.cat)}
    render()});
  const cp=$("#copy");if(cp)cp.onclick=()=>{
    const t=resultsText(),m=$("#msg");
    const fallback=()=>{m.innerHTML='<p class="hint">Copy didn\'t work here. Select all of this text and copy it:</p><textarea style="min-height:200px" readonly>'+esc(t)+'</textarea>';const ta=m.querySelector("textarea");ta.focus();ta.select()};
    try{navigator.clipboard.writeText(t).then(()=>{m.innerHTML='<p class="copied">Copied. Paste it into your assignment.</p>'},fallback)}catch(e){fallback()}};
  const rp=$("#replay");if(rp)rp.onclick=()=>{newGame();S.step=GAME0;render();try{window.scrollTo({top:0})}catch(e){}};
  const ed=$("#edit");if(ed)ed.onclick=()=>{S.G=null;S.step=8;render();try{window.scrollTo({top:0})}catch(e){}};
  const rs=$("#reset");if(rs)rs.onclick=()=>{$("#msg").innerHTML='<div class="confirm">Erase your whole plan and start over? <button class="btn small" id="yes">Yes, start over</button><button class="btn ghost small" id="no">Cancel</button></div>';
    $("#yes").onclick=()=>{const n=S.name,p=S.period;S=FRESH();S.name=n;S.period=p;S.step=1;render();try{window.scrollTo({top:0})}catch(e){}};
    $("#no").onclick=()=>{$("#msg").innerHTML=""}};
}
function bindCars(){$$("[data-car]").forEach(b=>b.onclick=()=>{S.career=b.dataset.car;render()})}

if(S.step>=GAME0&&!S.G){S.step=8}
render();
</script>
</body>
</html>
